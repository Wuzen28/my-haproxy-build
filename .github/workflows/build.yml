name: Build HAProxy for R66S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Ubuntu Environment
      run: |
        sudo apt-get update
        # 在依赖列表最后，精准加上了官方怨念的 python3-pyelftools
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget zstd curl python3-pyelftools

    - name: Download OpenWrt SDK (USTC Mirror)
      run: |
        curl -L -o openwrt-sdk.tar.zst "https://mirrors.ustc.edu.cn/openwrt/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        zstd -d openwrt-sdk.tar.zst
        tar -xf openwrt-sdk.tar
        mv openwrt-sdk-rockchip-* openwrt-sdk

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject HAProxy Makefile & Files
      run: |
        find openwrt-sdk/package/ -type d -name "haproxy" -exec rm -rf {} + 2>/dev/null || true
        mkdir -p openwrt-sdk/package/haproxy
        
        # 1. 下载官方最新的 Makefile
        curl -s -o openwrt-sdk/package/haproxy/Makefile https://raw.githubusercontent.com/openwrt/packages/master/net/haproxy/Makefile
        
        # 2. 强行改写版本号和 Hash 校验码
        sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=3.2.15/g' openwrt-sdk/package/haproxy/Makefile
        sed -i 's/PKG_RELEASE:=.*/PKG_RELEASE:=1/g' openwrt-sdk/package/haproxy/Makefile
        sed -i 's/PKG_HASH:=.*/PKG_HASH:=117e408aff544c9ad758c2fb3fd8cf791a72609d3ae319b2cf9f2a0b035393c2/g' openwrt-sdk/package/haproxy/Makefile
        
        # 3. 抓取官方配套的 files 文件夹
        git clone --depth=1 https://github.com/openwrt/packages.git /tmp/packages
        cp -r /tmp/packages/net/haproxy/files openwrt-sdk/package/haproxy/files

    - name: Compile HAProxy
      run: |
        cd openwrt-sdk
        make defconfig
        # 仅编译我们注入的专属 haproxy 包
        make package/haproxy/compile V=s

    - name: Upload IPK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: haproxy-3.2.15-ipk
        path: openwrt-sdk/bin/packages/aarch64_generic/packages/haproxy*.ipk
