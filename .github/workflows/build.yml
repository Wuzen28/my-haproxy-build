name: Build HAProxy for R66S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Ubuntu Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget zstd curl

    - name: Download OpenWrt SDK (USTC Mirror)
      run: |
        curl -L -o openwrt-sdk.tar.zst "https://mirrors.ustc.edu.cn/openwrt/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        zstd -d openwrt-sdk.tar.zst
        tar -xf openwrt-sdk.tar
        mv openwrt-sdk-rockchip-* openwrt-sdk

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject HAProxy Makefile & Files
      run: |
        # 1. 彻底清理旧的 haproxy 文件夹
        find openwrt-sdk/package/ -type d -name "haproxy" -exec rm -rf {} + 2>/dev/null || true
        mkdir -p openwrt-sdk/package/haproxy
        
        # 2. 【核心改动】直接在现场生成你的 3.2.15 Makefile，不依赖任何外部路径！
        cat << 'EOF' > openwrt-sdk/package/haproxy/Makefile
#
# Copyright (C) 2010-2016 OpenWrt.org
# Copyright (C) 2009-2016 Thomas Heil <heil@terminal-consulting.de>
# Copyright (C) 2018 Christian Lachner <gladiac@gmail.com>
#

include $(TOPDIR)/rules.mk

PKG_NAME:=haproxy
PKG_VERSION:=3.2.15
PKG_RELEASE:=1

PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
PKG_SOURCE_URL:=https://www.haproxy.org/download/3.2/src
PKG_HASH:=117e408aff544c9ad758c2fb3fd8cf791a72609d3ae319b2cf9f2a0b035393c2

PKG_MAINTAINER:=Thomas Heil <heil@terminal-consulting.de>, Christian Lachner <gladiac@gmail.com>
PKG_LICENSE:=GPL-2.0-only
PKG_LICENSE_FILES:=LICENSE
PKG_CPE_ID:=cpe:/a:haproxy:haproxy

include $(INCLUDE_DIR)/package.mk

define Package/haproxy/Default
  SUBMENU:=Web Servers/Proxies
  SECTION:=net
  CATEGORY:=Network
  TITLE:=TCP/HTTP Load Balancer
  URL:=https://www.haproxy.org/
  DEPENDS:= +USE_GLIBC:libcrypt-compat +libpcre2 +libltdl +zlib +libpthread +liblua5.4 +libatomic
endef

define Package/haproxy/conffiles
/etc/haproxy.cfg
endef

Package/haproxy-nossl/conffiles = $(Package/haproxy/conffiles)

define Package/haproxy/Default/description
 Open source Reliable, High Performance TCP/HTTP Load Balancer.
endef

define Package/haproxy
  $(call Package/haproxy/Default)
  TITLE+=with SSL support
  DEPENDS+= +libopenssl +libncurses +libreadline
  VARIANT:=ssl
endef

define Package/haproxy/description
$(call Package/haproxy/Default/description)
 This package is built with SSL and LUA support.
endef

define Package/haproxy-nossl
  $(call Package/haproxy/Default)
  TITLE+=without SSL support
  VARIANT:=nossl
  CONFLICTS:=haproxy
endef

define Package/haproxy-nossl/description
  $(call Package/haproxy/Default/description)
 This package is built without SSL support.
endef

TARGET=linux-musl
ENABLE_LUA:=y

ifeq ($(CONFIG_USE_GLIBC),y)
	TARGET=linux-glibc
endif

ifeq ($(BUILD_VARIANT),ssl)
	ADDON+=USE_OPENSSL=1
	ADDON+=ADDLIB="-lcrypto -lm"
	ADDON+=USE_QUIC=1
endif

define Build/Compile
	$(MAKE) TARGET=$(TARGET) -C $(PKG_BUILD_DIR) \
		DESTDIR="$(PKG_INSTALL_DIR)" \
		CC="$(TARGET_CC)" \
		PCREDIR="$(STAGING_DIR)/usr/" \
		USE_LUA=1 LUA_LIB_NAME="lua5.4" LUA_INC="$(STAGING_DIR)/usr/include/lua5.4" LUA_LIB="$(STAGING_DIR)/usr/lib" \
		USE_ZLIB=1 USE_PCRE2=1 USE_PCRE2_JIT=1 USE_LIBATOMIC=1 USE_PROMEX=1 \
		VERSION="$(PKG_VERSION)" SUBVERS="-$(PKG_RELEASE)" \
		VERDATE="$(shell date -d @$(SOURCE_DATE_EPOCH) '+%Y/%m/%d')" IGNOREGIT=1 \
		$(ADDON) \
		CFLAGS="$(TARGET_CFLAGS) -fno-strict-aliasing -Wdeclaration-after-statement -Wno-unused-label -Wno-sign-compare -Wno-unused-parameter -Wno-clobbered -Wno-missing-field-initializers -Wno-cast-function-type -Wno-address-of-packed-member -Wtype-limits -Wshift-negative-value -Wshift-overflow=2 -Wduplicated-cond -Wnull-dereference -fwrapv -fasynchronous-unwind-tables -Wno-null-dereference" \
		LD="$(TARGET_CC)" \
		LDFLAGS="$(TARGET_LDFLAGS)"

	$(MAKE_VARS) $(MAKE) -C $(PKG_BUILD_DIR) \
		DESTDIR="$(PKG_INSTALL_DIR)" \
		LD="$(TARGET_CC)" \
		LDFLAGS="$(TARGET_LDFLAGS)" \
		$(MAKE_FLAGS) \
		install

	$(MAKE_VARS) $(MAKE) -C $(PKG_BUILD_DIR) \
		DESTDIR="$(PKG_INSTALL_DIR)" \
		CC="$(TARGET_CC)" \
		CFLAGS="$(TARGET_CFLAGS) -Wno-address-of-packed-member" \
		LDFLAGS="$(TARGET_LDFLAGS)" \
		admin/halog/halog
endef

define Package/haproxy/install
	$(INSTALL_DIR) $(1)/usr/sbin
	$(INSTALL_BIN) $(PKG_BUILD_DIR)/haproxy $(1)/usr/sbin/
	$(INSTALL_DIR) $(1)/etc
	$(INSTALL_CONF) ./files/haproxy.cfg $(1)/etc/
	$(INSTALL_DIR) $(1)/etc/init.d
	$(INSTALL_BIN) ./files/haproxy.init $(1)/etc/init.d/haproxy
endef

Package/haproxy-nossl/install = $(Package/haproxy/install)

define Package/halog
  $(call Package/haproxy)
  TITLE+=halog
  DEPENDS:=haproxy
endef

define Package/halog/description
  HAProxy Log Analyzer
endef

define Package/halog/install
	$(INSTALL_DIR) $(1)/usr/bin
	$(INSTALL_BIN) $(PKG_BUILD_DIR)/admin/halog/halog $(1)/usr/bin/
endef

$(eval $(call BuildPackage,haproxy))
$(eval $(call BuildPackage,halog))
$(eval $(call BuildPackage,haproxy-nossl))
EOF

        # 3. 抓取官方配套的 files 文件夹
        git clone --depth=1 https://github.com/openwrt/packages.git /tmp/packages
        cp -r /tmp/packages/net/haproxy/files openwrt-sdk/package/haproxy/files

    - name: Compile HAProxy
      run: |
        cd openwrt-sdk
        make defconfig
        make package/haproxy/compile V=s

    - name: Upload IPK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: haproxy-3.2.15-ipk
        path: openwrt-sdk/bin/packages/aarch64_generic/packages/haproxy*.ipk
