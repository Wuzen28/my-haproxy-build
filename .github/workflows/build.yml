name: Build HAProxy for R66S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Ubuntu Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Download OpenWrt SDK (Latest Snapshots)
      run: |
        # 使用官方最新的快照版 SDK，这个链接在官方服务器上是永恒固定、每天自动更新的，绝对不会报 404
        wget https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-14.2.0_musl.Linux-x86_64.tar.xz
        tar -xJf openwrt-sdk-*.tar.xz
        mv openwrt-sdk-* openwrt-sdk

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Replace HAProxy Makefile & Files
      run: |
        # 彻底清理环境中的旧版 haproxy 文件夹
        find openwrt-sdk/package/ -type d -name "haproxy" -exec rm -rf {} + 2>/dev/null || true
        
        # 重新创建干净的存放目录
        mkdir -p openwrt-sdk/package/haproxy
        
        # 1. 复制你仓库里的最新 3.2.15 Makefile
        cp ../path/haproxy/Makefile openwrt-sdk/package/haproxy/Makefile
        
        # 2. 极其稳妥地直接抓取官方配套的最全 files 文件夹
        git clone --depth=1 https://github.com/openwrt/packages.git /tmp/packages
        cp -r /tmp/packages/net/haproxy/files openwrt-sdk/package/haproxy/files

    - name: Compile HAProxy
      run: |
        cd openwrt-sdk
        make defconfig
        # 仅编译我们注入的专属 haproxy 包
        make package/haproxy/compile V=s

    - name: Upload IPK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: haproxy-3.2.15-ipk
        path: openwrt-sdk/bin/packages/aarch64_generic/packages/haproxy*.ipk
