name: Build HAProxy for R66S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Ubuntu Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Download OpenWrt SDK (Tsinghua Mirror)
      run: |
        # 换用清华大学开源镜像站，速度极快且极度稳定，防止 Exit Code 100 报错
        wget https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/23.05.3/targets/rockchip/armv8/openwrt-sdk-23.05.3-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        tar -xJf openwrt-sdk-*.tar.xz
        mv openwrt-sdk-* openwrt-sdk

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Replace HAProxy Makefile & Files
      run: |
        # 清理旧包目录
        rm -rf openwrt-sdk/package/feeds/packages/net/haproxy
        mkdir -p openwrt-sdk/package/feeds/packages/net/haproxy
        
        # 1. 复制你仓库里的最新 3.2.15 Makefile
        cp ../path/haproxy/Makefile openwrt-sdk/package/feeds/packages/net/haproxy/Makefile
        
        # 2. 极其稳妥地抓取官方配套的 files 文件夹
        git clone --depth=1 https://github.com/openwrt/packages.git /tmp/packages
        cp -r /tmp/packages/net/haproxy/files openwrt-sdk/package/feeds/packages/net/haproxy/files

    - name: Compile HAProxy
      run: |
        cd openwrt-sdk
        make defconfig
        # 仅编译 haproxy 核心包，提高成功率
        make package/feeds/packages/net/haproxy/compile V=s

    - name: Upload IPK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: haproxy-3.2.15-ipk
        path: openwrt-sdk/bin/packages/aarch64_cortex-a53/packages/haproxy*.ipk
