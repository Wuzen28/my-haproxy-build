name: Build HAProxy for R66S (24.02 IPK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Ubuntu Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget curl python3-pyelftools

    - name: Download OpenWrt 24.02 SDK (USTC Mirror)
      run: |
        # 使用 24.02 稳定版标准的 .tar.xz 格式绝对路径
        wget https://mirrors.ustc.edu.cn/openwrt/releases/24.02.0/targets/rockchip/armv8/openwrt-sdk-24.02.0-rockchip-armv8_gcc-13.2.0_musl.Linux-x86_64.tar.xz
        
        # 使用标准的 tar -xJf 解压 xz 格式
        tar -xJf openwrt-sdk-*.tar.xz
        mv openwrt-sdk-* openwrt-sdk

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject HAProxy Makefile & Files
      run: |
        find openwrt-sdk/package/ -type d -name "haproxy" -exec rm -rf {} + 2>/dev/null || true
        mkdir -p openwrt-sdk/package/haproxy
        
        # 下载官方当前的 Makefile
        curl -s -o openwrt-sdk/package/haproxy/Makefile https://raw.githubusercontent.com/openwrt/packages/master/net/haproxy/Makefile
        
        # 强行改写版本号和 Hash 校验码
        sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=3.2.15/g' openwrt-sdk/package/haproxy/Makefile
        sed -i 's/PKG_RELEASE:=.*/PKG_RELEASE:=1/g' openwrt-sdk/package/haproxy/Makefile
        sed -i 's/PKG_HASH:=.*/PKG_HASH:=117e408aff544c9ad758c2fb3fd8cf791a72609d3ae319b2cf9f2a0b035393c2/g' openwrt-sdk/package/haproxy/Makefile
        
        # 抓取官方配套的 files 文件夹
        git clone --depth=1 https://github.com/openwrt/packages.git /tmp/packages
        cp -r /tmp/packages/net/haproxy/files openwrt-sdk/package/haproxy/files

    - name: Compile HAProxy
      run: |
        cd openwrt-sdk
        make defconfig
        make package/haproxy/compile V=s

    - name: Upload HAProxy IPK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: haproxy-3.2.15-ipk
        path: openwrt-sdk/bin/**/*.ipk
