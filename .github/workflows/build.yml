name: Build HAProxy for R66S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Ubuntu Environment
      run: |
        sudo apt-get update
        # 移除了已经绝版的 python3-distutils，换成了现代的 python3-setuptools 和 python3-dev
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget zstd curl

    - name: Download OpenWrt SDK (USTC Mirror)
      run: |
        curl -L -o openwrt-sdk.tar.zst "https://mirrors.ustc.edu.cn/openwrt/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        zstd -d openwrt-sdk.tar.zst
        tar -xf openwrt-sdk.tar
        mv openwrt-sdk-rockchip-* openwrt-sdk

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Replace HAProxy Makefile & Files
      run: |
        find openwrt-sdk/package/ -type d -name "haproxy" -exec rm -rf {} + 2>/dev/null || true
        mkdir -p openwrt-sdk/package/haproxy
        
        # 1. 复制你仓库里的最新 3.2.15 Makefile
        cp ../path/haproxy/Makefile openwrt-sdk/package/haproxy/Makefile
        
        # 2. 抓取官方配套的最全 files 文件夹
        git clone --depth=1 https://github.com/openwrt/packages.git /tmp/packages
        cp -r /tmp/packages/net/haproxy/files openwrt-sdk/package/haproxy/files

    - name: Compile HAProxy
      run: |
        cd openwrt-sdk
        make defconfig
        make package/haproxy/compile V=s

    - name: Upload IPK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: haproxy-3.2.15-ipk
        path: openwrt-sdk/bin/packages/aarch64_generic/packages/haproxy*.ipk
